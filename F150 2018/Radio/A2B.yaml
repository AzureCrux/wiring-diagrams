templates:
  - &tmp_DTM-4F
    type: DTM
    color: GY
    subtype: female
    pincount: 4
  - &RCA
    type: RCA
    pincount: 2
    notes: RCA pair. Each "pin" represents a shielded wire pair
connectors:
  CA3001:
    type: 
    subtype: male
    color: BK
    notes: A2B input
    pincount: 10
    pins: [1,2,5,6,10]
    pinlabels:
      - GND(-)
      - Remote OUT
      - CAN HI
      - BATT(+)
      - CAN LO
    pincolors: [BK, BU, VTBU, YE, VT]
    # image:
    #   src: /../../assets/F150 2018/connectors/C-A1.png
    pn: HAR325

  CA3002:
    <<: *tmp_DTM-4F
    pinlabels:
      - BATT (+)
      - CAN HI
      - GND (-)
      - CAN LO
    notes: from OEM C3154A
  CA3003:
    <<: *tmp_DTM-4F

  C-R1:
    type: Relay Module
    subtype: female
    pincount: 5
    pinlabels: [VCC, GND, IN, NO, COM, NC]
  
  M-A100:
    notes: Skar Power Dist
  M-A101:
    notes: Skar Audio in
  M-A102:
    notes: Audio out 
  # M-A200: 

  SP-101:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FL Door
  SP-102:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FL Mid
  SP-103:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FL Tweeter
  SP-104:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FR Door
  SP-105:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FR Mid
  SP-106:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: FR Tweeter
  SP-107:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: RL Door
  SP-108:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: RR Door
  SP-109:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: SW - Left
  SP-110:
    pincount: 2
    pinlabels: [Pos (+), Neg (-)]
    notes: SW - Right
  
    
  C3154A:
    type: OEM
    subtype: female
    pincount: 20
    pins: [
      1, 4, 5, 6, 7, 8, 9, 10, 11, 
      14, 15, 16, 17, 18, 19, 20
    ]
    pinlabels: 
      - CAN HI
      - Center Channel (-)
      - Subwoofer COIL 1 (-)
      - Right Front Door (-)
      - Left Front Door (-)
      - Right Rear Door (-)
      - Subwoofer COIL 2 (-)
      - Left Rear Door (-)
      - CAN LO
      - Center Channel (+)
      - Subwoofer COIL 1 (+)
      - Right Front Door (+)
      - Left Front Door (+)
      - Right Rear Door (+)
      - Subwoofer COIL 2 (+)
      - Left Rear Door (+)

cables:
  W3001:
    length: 1 ft
    wirecount: 4
    colors: [BK, YE, VTWH, VT]
    notes: CAN HI/LO twisted pair, part of HAR325

  #remote
  W3002:
    length: 1 ft
    wirecount: 1
    colors: [BU]
    notes: part of HAR325


  W3003:
    length: 1 ft
    wirecount: 12
    notes: part of HAR325
  W3004:
    length: 1 ft
    wirecount: 1
    notes: part of HAR325

connections:
  -
    - CA3001: [2]
    - W3002: [1]
    - C-R1: [3]
