templates:
  &tmp_DTM-4F
    type: DTM
    color: GY
    subtype: female
    pincount: 4
connectors:
  C3154A:
    type: OEM
    subtype: Male
    pincount: 20
    pins: [
      1, 4, 5, 6, 7, 8, 9, 10, 11, 
      14, 15, 16, 17, 18, 19, 20
    ]
    pinlabels: 
      - CAN HI
      - Center Channel (-)
      - Subwoofer COIL 1 (-)
      - FR Door Speaker (-)
      - FL Door Speaker (-)
      - RR Door Speaker (-)
      - Subwoofer COIL 2 (-)
      - LR Door Speaker (-)
      - CAN LO
      - Center Channel (+)
      - Subwoofer COIL 1 (+)
      - FR Door Speaker (+)
      - FL Door Speaker (+)
      - RR Door Speaker (+)
      - Subwoofer COIL 2 (+)
      - LR Door Speaker (+)
    image:
      src: ../../assets/F150 2018/connectors/C3154A.png
  C3154B:
    type: OEM
    subtype: Male
    pincount: 8
    pins: [1,4,5,8]
    pinlabels:
      - BATT (+)
      - GND (-)
      - BATT (+)
      - GND (-)
    image:
      src: ../../assets/F150 2018/connectors/C3154B.png
  CA3002:
    <<: *tmp_DTM-4F
    pinlabels:
      - BATT (+)
      - CAN HI
      - GND (-)
      - CAN LO
    notes: To A2B Module
  CA3003:
    <<: *tmp_DTM-4F
    pincount: 3
    pinlabels: 
      - BATT (+)
      - Remote Turn on Sense
      - GND (-)
    notes: To Remote turn-on relay module (M-R1)
  CA3010:
    type: DTM
    color: GY
    pincount: 12
    pinlabels:
      - FL Door Speaker (+)
      - FL Mid Speaker (+)
      - FL High Speaker (+)
      - FR Door Speaker (+)
      - FR Mid Speaker (+)
      - FR High Speaker (+)
      - FL Door Speaker (-)
      - FL Mid Speaker (-)
      - FL High Speaker (-)
      - FR Door Speaker (-)
      - FR Mid Speaker (-)
      - FR High Speaker (-)
    notes: |
      Connector for front stage. 
      Will eventually be 6-channel
  CA3011:
    type: DTM
    color: GY
    pincount: 4
    pinlabels:
      - LR Door Speaker (+)
      - RR Door Speaker (+)
      - LR Door Speaker (-)
      - RR Door Speaker (-)
    notes: Connector for rear speakers

cables:
